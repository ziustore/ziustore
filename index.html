<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZIUSTORE | Professional Gaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f4f4; }
        .shopee-orange { background-color: #ee4d2d; }
        .shopee-text { color: #ee4d2d; }
        .product-card { background: white; border-radius: 12px; border: 1px solid #eee; overflow: hidden; transition: 0.2s; }
        .product-card:active { transform: scale(0.97); }
        .main-container { width: 100%; max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        .sticky-bottom { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        input { font-size: 16px !important; }
    </style>
</head>
<body class="flex justify-center">

    <div class="main-container shadow-2xl pb-40">
        <header class="shopee-orange p-5 sticky top-0 z-50 shadow-md flex items-center justify-between text-white">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/qYvPwykP/Whats-App-Image-2025-12-19-at-10-45-37-b356ef8c.jpg" class="w-11 h-11 rounded-full border-2 border-white shadow-sm">
                <div>
                    <h1 class="font-black italic text-xl tracking-tighter">ZIUSTORE</h1>
                    <p class="text-[8px] font-bold opacity-80 uppercase tracking-widest">Timor-Leste Gaming Gear</p>
                </div>
            </div>
            <i class="fa-solid fa-cart-shopping opacity-50"></i>
        </header>

        <div class="p-3">
            <div class="bg-orange-50 border border-orange-100 p-3 rounded-xl flex items-center gap-3">
                <div class="bg-orange-500 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>
                <p class="text-[10px] font-bold text-orange-800">Entrega kmanek no lalais ba Baucau Vila, Laga, Venilale no Dili!</p>
            </div>
        </div>

        <div class="p-3 grid grid-cols-2 gap-3" id="product-grid"></div>

        <div class="p-3 space-y-3">
            <div class="bg-white p-4 rounded-xl border-2 border-gray-50 shadow-sm">
                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 block">Informasaun Kliente</label>
                <input type="text" id="custName" placeholder="Naran Kompletu" class="w-full p-3 bg-gray-50 border rounded-lg text-sm font-bold mb-2 outline-none focus:border-orange-500">
                <input type="number" id="custPhone" placeholder="Númeru WhatsApp (733...)" class="w-full p-3 bg-gray-50 border rounded-lg text-sm font-bold outline-none focus:border-orange-500">
            </div>
        </div>

        <div class="sticky-bottom flex items-center shadow-2xl border-t">
            <div class="flex-1 px-5 py-3">
                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Total Hamutuk</p>
                <p id="totalDisplay" class="text-2xl font-black shopee-text leading-none">$0.00</p>
            </div>
            <button onclick="handleCheckout()" class="shopee-orange text-white px-8 py-6 font-black uppercase text-sm flex items-center gap-2">
                CHECKOUT <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Hyper X Cloud III", price: 110, img: "https://i.ibb.co/s95BXxZN/heandset-hyper-x-cloud-III-edit-foto.jpg" },
            { id: 2, name: "Ugreen Charger 20W", price: 35, img: "https://i.ibb.co/twJv4gTN/ugreen-20w-usb-c-charger-with-mfi-certified-lightning-cable-pd-usb-c-power-supply-usb-c-charging-plu.webp" },
            { id: 3, name: "Sarung Jempol King", price: 5, img: "https://i.ibb.co/Xf22qV6Z/sarung-jempol-gaming-ap-king.jpg" },
            { id: 4, name: "Lightning Braided", price: 15, img: "https://i.ibb.co/k2wMSj5k/kabel-extension-lightening-braided-kabel.jpg" },
            { id: 5, name: "Headset AKZ 6 Pro", price: 15, img: "https://i.ibb.co/bVRvptC/akz-6-pro-hitam.jpg" },
            { id: 6, name: "Funcooler AL19", price: 15, img: "https://i.ibb.co/bT53nsg/funcooler-al19.jpg" },
            { id: 7, name: "Splitter Kaizer", price: 15, img: "https://i.ibb.co/Ndgc73wq/splitter-lightening-kaizer.jpg" },
            { id: 8, name: "Kipas Acome AF001", price: 15, img: "https://i.ibb.co/C5YLyLF8/kipas-AF001-dark-blue.webp" },
            { id: 9, name: "HDMI 3in1 PX", price: 15, img: "https://i.ibb.co/N693FZGW/kabel-hdmi-ke-type-c-px.jpg" },
            { id: 10, name: "Video Capture PX", price: 15, img: "https://i.ibb.co/27L9fBnC/VIDEO-CAPTURE-HDMI-MEREK-PX.jpg" },
            { id: 11, name: "HyperX Earbuds", price: 15, img: "https://i.ibb.co/mr31wJVZ/hyper-X-cloud-earbuds-gaming.jpg" }
        ];

        function renderProducts() {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="product-card p-3 flex flex-col justify-between shadow-sm">
                    <img src="${p.img}" class="w-full h-28 object-contain mb-2 rounded-lg">
                    <h3 class="text-[10px] text-gray-500 font-bold uppercase leading-tight h-8 overflow-hidden">${p.name}</h3>
                    <p class="shopee-text font-black text-lg mt-1">$${p.price.toFixed(2)}</p>
                    <div class="flex items-center justify-between mt-3 bg-gray-100 rounded-lg p-1 border">
                        <button onclick="changeQty('q${p.id}', -1)" class="w-8 h-8 font-black text-gray-400">-</button>
                        <input type="number" id="q${p.id}" value="0" min="0" class="bg-transparent w-8 text-center text-xs font-black outline-none" readonly>
                        <button onclick="changeQty('q${p.id}', 1)" class="w-8 h-8 font-black shopee-text">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, n) {
            let el = document.getElementById(id);
            let val = parseInt(el.value) + n;
            if(val >= 0) { el.value = val; updateTotal(); }
        }

        function updateTotal() {
            let sum = 0;
            products.forEach(p => {
                let qty = parseInt(document.getElementById('q' + p.id).value) || 0;
                sum += (qty * p.price);
            });
            document.getElementById('totalDisplay').innerText = `$${sum.toFixed(2)}`;
        }

        function handleCheckout() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            let itemsText = "";
            let totalSasan = 0;

            products.forEach(p => {
                let qty = parseInt(document.getElementById('q' + p.id).value) || 0;
                if(qty > 0) {
                    itemsText += `✅ ${p.name} (${qty}x)\n`;
                    totalSasan += (p.price * qty);
                }
            });

            if(!name || !phone || totalSasan === 0) {
                alert("Favor hatama Naran, Nu. WA, no hili Sasan!");
                return;
            }

            // NOMOR HP BOS (PAKAI FORMAT INTERNASIONAL TANPA TANDA +)
            const adminWA = "67073350229";
            
            // PESAN YANG AKAN DIKIRIM (DIBUAT LEBIH BERSIH)
            const fullMsg = `HALO ZIUSTORE\n\n` +
                            `Naran: ${name.toUpperCase()}\n` +
                            `WhatsApp: ${phone}\n\n` +
                            `Sasan Sosa:\n${itemsText}\n` +
                            `TOTAL: ${document.getElementById('totalDisplay').innerText}`;
            
            // FORMAT LINK PALING STABIL UNTUK SEMUA HP
            const waUrl = `https://api.whatsapp.com/send?phone=${adminWA}&text=${encodeURIComponent(fullMsg)}`;
            
            // PROSES PINDAH KE WHATSAPP
            window.location.href = waUrl;
        }

        renderProducts();
    </script>
</body>
</html>
