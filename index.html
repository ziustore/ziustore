<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZIUSTORE | Checkout System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f0f0; -webkit-tap-highlight-color: transparent; }
        .shopee-orange { background-color: #ee4d2d; }
        .shopee-text { color: #ee4d2d; }
        .main-container { width: 100%; max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        .product-card { background: white; border-radius: 8px; border: 1px solid #eee; padding: 10px; }
        .sticky-bottom { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; z-index: 50; }
        
        /* Modal Style */
        #waModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 350px; border-radius: 20px; overflow: hidden; animation: zoomIn 0.3s; }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="flex justify-center">

    <div class="main-container shadow-2xl pb-40">
        <header class="shopee-orange p-4 sticky top-0 z-50 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3 text-white">
                <img src="https://i.ibb.co/qYvPwykP/Whats-App-Image-2025-12-19-at-10-45-37-b356ef8c.jpg" class="w-10 h-10 rounded-full border-2 border-white">
                <h1 class="font-black italic text-xl">ZIUSTORE</h1>
            </div>
            <button onclick="loginAdmin()" class="text-white opacity-20"><i class="fa-solid fa-gear"></i></button>
        </header>

        <div class="p-3 grid grid-cols-2 gap-2" id="product-grid"></div>

        <div class="p-3 space-y-4">
            <div class="bg-gray-50 p-4 rounded-xl border">
                <p class="text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">Lokasi Pengiriman</p>
                <select id="ongkir" onchange="updateTotal()" class="w-full p-3 border rounded-lg text-sm font-bold bg-white">
                    <option value="0.00">BAUCAU VILA (FREE)</option>
                    <option value="2.50">VENILALE (+$2.50)</option>
                    <option value="3.50">LAGA (+$3.50)</option>
                    <option value="5.00">DILI (+$5.00)</option>
                </select>
            </div>
            <div class="bg-white p-4 rounded-xl border-2 border-orange-100">
                <p class="text-[10px] font-black text-orange-600 uppercase mb-2 tracking-widest">Data Pembeli</p>
                <input type="text" id="custName" placeholder="Nama Lengkap" class="w-full p-3 border rounded-lg text-sm font-bold mb-2 bg-gray-50">
                <input type="number" id="custPhone" placeholder="Nomor WhatsApp" class="w-full p-3 border rounded-lg text-sm font-bold bg-gray-50">
            </div>
        </div>

        <div class="sticky-bottom flex items-center shadow-lg">
            <div class="flex-1 px-5 py-3">
                <p class="text-[9px] text-gray-400 font-bold uppercase">Total Bayar</p>
                <p id="totalDisplay" class="text-xl font-black shopee-text">$0.00</p>
            </div>
            <button onclick="prepareCheckout()" class="shopee-orange text-white px-10 py-6 font-black uppercase text-sm">
                CHECKOUT
            </button>
        </div>
    </div>

    <div id="waModal">
        <div class="modal-content shadow-2xl">
            <div class="shopee-orange p-6 text-white text-center">
                <i class="fa-solid fa-circle-check text-5xl mb-3"></i>
                <h3 class="font-black text-lg">PESANAN SIAP!</h3>
                <p class="text-xs opacity-80">Klik tombol di bawah untuk mengirim pesanan ke WhatsApp Admin</p>
            </div>
            <div class="p-5 space-y-3">
                <button id="btnSendWA" class="w-full bg-green-500 text-white font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-all">
                    <i class="fa-brands fa-whatsapp text-xl"></i> KIRIM KE WHATSAPP
                </button>
                <button onclick="closeModal()" class="w-full text-gray-400 text-xs font-bold py-2">BATALKAN</button>
            </div>
        </div>
    </div>

    <div id="adminPanel" class="fixed inset-0 bg-white z-[3000] hidden overflow-y-auto">
        <header class="bg-gray-800 p-4 text-white flex justify-between items-center sticky top-0">
            <h2 class="font-bold">Daftar Pesanan</h2>
            <button onclick="document.getElementById('adminPanel').style.display='none'" class="bg-red-500 px-3 py-1 rounded text-xs">TUTUP</button>
        </header>
        <div id="orderList" class="p-4 space-y-4"></div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Hyper X Cloud III", price: 110, img: "https://i.ibb.co/s95BXxZN/heandset-hyper-x-cloud-III-edit-foto.jpg" },
            { id: 2, name: "Ugreen Charger 20W", price: 35, img: "https://i.ibb.co/twJv4gTN/ugreen-20w-usb-c-charger-with-mfi-certified-lightning-cable-pd-usb-c-power-supply-usb-c-charging-plu.webp" },
            { id: 3, name: "Sarung Jempol King", price: 5, img: "https://i.ibb.co/Xf22qV6Z/sarung-jempol-gaming-ap-king.jpg" },
            { id: 4, name: "Lightning Braided", price: 15, img: "https://i.ibb.co/k2wMSj5k/kabel-extension-lightening-braided-kabel.jpg" },
            { id: 5, name: "Headset AKZ 6 Pro", price: 15, img: "https://i.ibb.co/bVRvptC/akz-6-pro-hitam.jpg" },
            { id: 6, name: "Funcooler AL19", price: 15, img: "https://i.ibb.co/bT53nsg/funcooler-al19.jpg" },
            { id: 7, name: "Splitter Kaizer", price: 15, img: "https://i.ibb.co/Ndgc73wq/splitter-lightening-kaizer.jpg" },
            { id: 8, name: "Kipas Acome AF001", price: 15, img: "https://i.ibb.co/C5YLyLF8/kipas-AF001-dark-blue.webp" },
            { id: 9, name: "HDMI 3in1 PX", price: 15, img: "https://i.ibb.co/N693FZGW/kabel-hdmi-ke-type-c-px.jpg" },
            { id: 10, name: "Video Capture PX", price: 15, img: "https://i.ibb.co/27L9fBnC/VIDEO-CAPTURE-HDMI-MEREK-PX.jpg" },
            { id: 11, name: "HyperX Earbuds", price: 15, img: "https://i.ibb.co/mr31wJVZ/hyper-X-cloud-earbuds-gaming.jpg" }
        ];

        function renderProducts() {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="product-card flex flex-col justify-between">
                    <img src="${p.img}" class="w-full h-24 object-contain mb-2">
                    <h3 class="text-[10px] text-gray-500 font-bold uppercase leading-tight h-8 overflow-hidden">${p.name}</h3>
                    <p class="shopee-text font-black text-lg">$${p.price.toFixed(2)}</p>
                    <div class="flex items-center justify-between mt-2 bg-gray-50 rounded p-1">
                        <button onclick="changeQty('q${p.id}', -1)" class="w-7 h-7 font-bold text-gray-300">-</button>
                        <input type="number" id="q${p.id}" value="0" min="0" class="bg-transparent w-8 text-center text-xs font-black outline-none" readonly>
                        <button onclick="changeQty('q${p.id}', 1)" class="w-7 h-7 font-bold shopee-text">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, n) {
            let el = document.getElementById(id);
            let val = parseInt(el.value) + n;
            if(val >= 0) { el.value = val; updateTotal(); }
        }

        function updateTotal() {
            let sum = 0;
            products.forEach(p => {
                let qty = parseInt(document.getElementById('q' + p.id).value) || 0;
                sum += (qty * p.price);
            });
            let ship = parseFloat(document.getElementById('ongkir').value);
            let total = sum > 0 ? sum + ship : 0;
            document.getElementById('totalDisplay').innerText = `$${total.toFixed(2)}`;
        }

        function prepareCheckout() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            let items = []; let totalSasan = 0;

            products.forEach(p => {
                let qty = parseInt(document.getElementById('q' + p.id).value) || 0;
                if(qty > 0) {
                    items.push(`✅ ${p.name} (${qty}x)`);
                    totalSasan += (p.price * qty);
                }
            });

            if(!name || !phone || totalSasan === 0) {
                alert("Harap isi Nama, No WA, dan pilih barang!");
                return;
            }

            // Simpan ke Admin
            const order = { id: Date.now(), name, phone, items: items.join(", "), total: document.getElementById('totalDisplay').innerText, time: new Date().toLocaleString() };
            const all = JSON.parse(localStorage.getItem('ziustore_orders')) || [];
            all.unshift(order);
            localStorage.setItem('ziustore_orders', JSON.stringify(all));

            // Siapkan Link WA
            const adminWA = "67073350229";
            const ship = document.getElementById('ongkir').options[document.getElementById('ongkir').selectedIndex].text;
            const msg = `*ZIUSTORE ORDER*\n━━━━━━━━━━━━━━\n👤 *NAMA:* ${name.toUpperCase()}\n📱 *WA:* ${phone}\n📍 *LOKASI:* ${ship}\n━━━━━━━━━━━━━━\n*BARANG:*\n${items.join('\n')}\n━━━━━━━━━━━━━━\n💰 *TOTAL: ${document.getElementById('totalDisplay').innerText}*`;
            
            const waUrl = `https://api.whatsapp.com/send?phone=${adminWA}&text=${encodeURIComponent(msg)}`;
            
            // Tampilkan Modal
            document.getElementById('waModal').style.display = 'flex';
            document.getElementById('btnSendWA').onclick = () => {
                window.location.href = waUrl;
            };
        }

        function closeModal() { document.getElementById('waModal').style.display = 'none'; }

        function loginAdmin() {
            if(prompt("Pass:") === "admin123") {
                document.getElementById('adminPanel').style.display = 'block';
                const orders = JSON.parse(localStorage.getItem('ziustore_orders')) || [];
                document.getElementById('orderList').innerHTML = orders.map(o => `
                    <div class="bg-gray-100 p-4 rounded-xl border">
                        <p class="text-[9px] font-bold text-gray-400">${o.time}</p>
                        <h4 class="font-black text-orange-600 uppercase text-sm">${o.name}</h4>
                        <p class="text-xs text-gray-700 bg-white p-2 rounded border my-2 font-medium">${o.items}</p>
                        <div class="flex gap-2">
                            <a href="https://wa.me/${o.phone}" class="flex-1 bg-green-500 text-white text-center py-2 rounded-lg text-xs font-bold">CHAT WA</a>
                            <a href="tel:${o.phone}" class="flex-1 bg-blue-500 text-white text-center py-2 rounded-lg text-xs font-bold">CALL</a>
                        </div>
                    </div>
                `).join('') || "Belum ada pesanan.";
            }
        }

        renderProducts();
    </script>
</body>
</html>
