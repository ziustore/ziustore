<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZIUSTORE | Fix Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f4f4; -webkit-tap-highlight-color: transparent; }
        .shopee-orange { background-color: #ee4d2d; }
        .shopee-text { color: #ee4d2d; }
        .product-card { background: white; border-radius: 12px; border: 1px solid #eee; overflow: hidden; }
        .main-container { width: 100%; max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; }
        .sticky-bottom { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        input, select { font-size: 16px !important; }
    </style>
</head>
<body class="flex justify-center">

    <div class="main-container shadow-2xl pb-40">
        <header class="shopee-orange p-5 sticky top-0 z-50 shadow-md flex items-center justify-between text-white">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/qYvPwykP/Whats-App-Image-2025-12-19-at-10-45-37-b356ef8c.jpg" class="w-11 h-11 rounded-full border-2 border-white">
                <h1 class="font-black italic text-xl tracking-tighter">ZIUSTORE</h1>
            </div>
            <button onclick="loginAdmin()" class="opacity-30"><i class="fa-solid fa-lock"></i></button>
        </header>

        <div class="p-3 grid grid-cols-2 gap-2" id="product-grid"></div>

        <div class="p-3 space-y-3">
            <div class="bg-gray-50 p-4 rounded-xl border">
                <label class="text-[10px] font-black text-gray-400 uppercase">Fatin Entrega:</label>
                <select id="ongkir" onchange="updateTotal()" class="w-full p-3 bg-white border rounded-lg text-sm font-bold mt-1">
                    <option value="0.00">BAUCAU VILA (FREE)</option>
                    <option value="2.50">VENILALE (+$2.50)</option>
                    <option value="3.50">LAGA (+$3.50)</option>
                    <option value="5.00">DILI (+$5.00)</option>
                </select>
            </div>
            <div class="bg-white p-4 rounded-xl border-2 border-orange-100 shadow-sm">
                <label class="text-[10px] font-black text-orange-600 uppercase">Dados Kliente:</label>
                <input type="text" id="custName" placeholder="Naran Kompletu" class="w-full p-3 bg-gray-50 border rounded-lg text-sm font-bold mt-1 mb-2">
                <input type="number" id="custPhone" placeholder="Númeru WhatsApp" class="w-full p-3 bg-gray-50 border rounded-lg text-sm font-bold">
            </div>
        </div>

        <div class="sticky-bottom flex items-center shadow-lg">
            <div class="flex-1 px-5 py-3">
                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Total</p>
                <p id="totalDisplay" class="text-xl font-black shopee-text">$0.00</p>
            </div>
            <button onclick="handleCheckout()" class="shopee-orange text-white px-8 py-6 font-black uppercase text-sm">
                Checkout <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>

    <div id="adminPanel" class="fixed inset-0 bg-white z-[1000] hidden overflow-y-auto">
        <header class="bg-black p-5 text-white flex justify-between">
            <h2 class="font-bold uppercase">Admin View</h2>
            <button onclick="document.getElementById('adminPanel').style.display='none'">[X]</button>
        </header>
        <div id="orderList" class="p-4 space-y-3"></div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Hyper X Cloud III", price: 110, img: "https://i.ibb.co/s95BXxZN/heandset-hyper-x-cloud-III-edit-foto.jpg" },
            { id: 2, name: "Ugreen Charger 20W", price: 35, img: "https://i.ibb.co/twJv4gTN/ugreen-20w-usb-c-charger-with-mfi-certified-lightning-cable-pd-usb-c-power-supply-usb-c-charging-plu.webp" },
            { id: 3, name: "Sarung Jempol King", price: 5, img: "https://i.ibb.co/Xf22qV6Z/sarung-jempol-gaming-ap-king.jpg" },
            { id: 4, name: "Lightning Braided", price: 15, img: "https://i.ibb.co/k2wMSj5k/kabel-extension-lightening-braided-kabel.jpg" },
            { id: 5, name: "Headset AKZ 6 Pro", price: 15, img: "https://i.ibb.co/bVRvptC/akz-6-pro-hitam.jpg" },
            { id: 6, name: "Funcooler AL19", price: 15, img: "https://i.ibb.co/bT53nsg/funcooler-al19.jpg" },
            { id: 7, name: "Splitter Kaizer", price: 15, img: "https://i.ibb.co/Ndgc73wq/splitter-lightening-kaizer.jpg" },
            { id: 8, name: "Kipas Acome AF001", price: 15, img: "https://i.ibb.co/C5YLyLF8/kipas-AF001-dark-blue.webp" },
            { id: 9, name: "HDMI 3in1 PX", price: 15, img: "https://i.ibb.co/N693FZGW/kabel-hdmi-ke-type-c-px.jpg" },
            { id: 10, name: "Video Capture PX", price: 15, img: "https://i.ibb.co/27L9fBnC/VIDEO-CAPTURE-HDMI-MEREK-PX.jpg" },
            { id: 11, name: "HyperX Earbuds", price: 15, img: "https://i.ibb.co/mr31wJVZ/hyper-X-cloud-earbuds-gaming.jpg" }
        ];

        function renderProducts() {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="product-card p-3 flex flex-col justify-between">
                    <img src="${p.img}" class="w-full h-24 object-contain mb-2">
                    <h3 class="text-[10px] text-gray-500 font-bold uppercase leading-tight h-8 overflow-hidden">${p.name}</h3>
                    <p class="shopee-text font-black text-lg">$${p.price.toFixed(2)}</p>
                    <div class="flex items-center justify-between mt-2 bg-gray-50 rounded p-1 border">
                        <button onclick="changeQty('q${p.id}', -1)" class="w-8 h-8 font-bold text-gray-300">-</button>
                        <input type="number" id="q${p.id}" value="0" min="0" class="bg-transparent w-8 text-center text-xs font-black outline-none" readonly>
                        <button onclick="changeQty('q${p.id}', 1)" class="w-8 h-8 font-bold shopee-text">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, n) {
            let el = document.getElementById(id);
            let val = parseInt(el.value) + n;
            if(val >= 0) { el.value = val; updateTotal(); }
        }

        function updateTotal() {
            let sum = 0;
            products.forEach(p => {
                let qty = parseInt(document.getElementById('q' + p.id).value) || 0;
                sum += (qty * p.price);
            });
            let ship = parseFloat(document.getElementById('ongkir').value);
            let total = sum > 0 ? sum + ship : 0;
            document.getElementById('totalDisplay').innerText = `$${total.toFixed(2)}`;
        }

        function handleCheckout() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            let itemsText = "";
            let listInternal = [];
            let totalSasan = 0;

            products.forEach(p => {
                let qty = parseInt(document.getElementById('q' + p.id).value) || 0;
                if(qty > 0) {
                    itemsText += `✅ ${p.name} (${qty}x)\n`;
                    listInternal.push(`${p.name} (${qty}x)`);
                    totalSasan += (p.price * qty);
                }
            });

            if(!name || !phone || totalSasan === 0) {
                alert("Favor hatama Naran, Nu. WA, no Hili Sasaan!");
                return;
            }

            // SIMPAN DATA BA ADMIN (BACKUP)
            let order = { id: Date.now(), name, phone, items: listInternal.join(", "), total: document.getElementById('totalDisplay').innerText, time: new Date().toLocaleString() };
            let allOrders = JSON.parse(localStorage.getItem('ziustore_orders')) || [];
            allOrders.unshift(order);
            localStorage.setItem('ziustore_orders', JSON.stringify(allOrders));

            // GENERATE LINK WHATSAPP (ENCODED)
            const adminWA = "67073350229";
            const shipText = document.getElementById('ongkir').options[document.getElementById('ongkir').selectedIndex].text;
            const fullMsg = `*ZIUSTORE ORDER*\n━━━━━━━━━━━━━━\n👤 *NARAN:* ${name.toUpperCase()}\n📱 *WA:* ${phone}\n📍 *FATIN:* ${shipText}\n━━━━━━━━━━━━━━\n*SASAN SOSA:*\n${itemsText}━━━━━━━━━━━━━━\n💰 *TOTAL: ${document.getElementById('totalDisplay').innerText}*`;
            
            const waUrl = `https://wa.me/${adminWA}?text=${encodeURIComponent(fullMsg)}`;
            
            // KOKO LOKE DIRECTO
            window.location.assign(waUrl);
        }

        function loginAdmin() {
            if(prompt("Pass:") === "admin123") {
                document.getElementById('adminPanel').style.display='block';
                const orders = JSON.parse(localStorage.getItem('ziustore_orders')) || [];
                document.getElementById('orderList').innerHTML = orders.map(o => `
                    <div class="bg-gray-100 p-3 rounded-lg border">
                        <p class="text-[9px] font-bold">${o.time}</p>
                        <h4 class="font-bold text-orange-600">${o.name} (${o.total})</h4>
                        <p class="text-xs text-gray-600 mb-2">${o.items}</p>
                        <div class="flex gap-2">
                            <a href="https://wa.me/${o.phone}" class="bg-green-500 text-white px-3 py-1 rounded text-xs">Chat WA</a>
                            <a href="tel:${o.phone}" class="bg-blue-500 text-white px-3 py-1 rounded text-xs">Telefone</a>
                        </div>
                    </div>
                `).join('') || "No orders.";
            }
        }

        renderProducts();
    </script>
</body>
</html>
