<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZIUSTORE | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f4f4; -webkit-tap-highlight-color: transparent; }
        .shopee-orange { background-color: #ee4d2d; }
        .shopee-text { color: #ee4d2d; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; transition: 0.1s; border: 1px solid #eee; }
        .product-card:active { transform: scale(0.96); background: #fafafa; }
        .main-container { width: 100%; max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        .sticky-bottom { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        input, select { font-size: 16px !important; } /* Fix iOS Zoom */
    </style>
</head>
<body class="flex justify-center">

    <div class="main-container shadow-2xl">
        
        <header class="shopee-orange p-5 sticky top-0 z-50 shadow-md flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/qYvPwykP/Whats-App-Image-2025-12-19-at-10-45-37-b356ef8c.jpg" class="w-11 h-11 rounded-full border-2 border-white/50">
                <div>
                    <h1 class="text-white font-black italic text-xl leading-none tracking-tighter">ZIUSTORE</h1>
                    <p class="text-[9px] text-white/80 font-bold uppercase tracking-widest mt-1">Direct Gaming Order</p>
                </div>
            </div>
            <button onclick="loginAdmin()" class="text-white/30 text-xl"><i class="fa-solid fa-shield-cat"></i></button>
        </header>

        <div class="p-3">
            <div class="flex items-center gap-2 mb-4 border-l-4 border-orange-500 pl-2">
                <h2 class="font-black text-gray-800 uppercase italic text-sm">Sasan Gaming (11)</h2>
            </div>
            <div class="grid grid-cols-2 gap-2" id="product-grid">
                </div>
        </div>

        <div class="p-3 space-y-3 mb-40">
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                <label class="text-[10px] font-black text-gray-400 uppercase block mb-2">Fatin Entrega:</label>
                <select id="ongkir" onchange="updateTotal()" class="w-full p-3 bg-white border rounded-lg text-sm font-bold outline-none focus:border-orange-500">
                    <option value="0.00">BAUCAU VILA (FREE)</option>
                    <option value="2.50">VENILALE (+$2.50)</option>
                    <option value="3.50">LAGA (+$3.50)</option>
                    <option value="5.00">DILI (+$5.00)</option>
                </select>
            </div>

            <div class="bg-white p-4 rounded-xl border-2 border-orange-500/20 shadow-sm">
                <label class="text-[10px] font-black text-orange-600 uppercase block mb-2">Dados Kliente:</label>
                <input type="text" id="custName" placeholder="Naran Kompletu" class="w-full p-3 bg-gray-50 border rounded-lg text-sm font-bold outline-none mb-2 focus:border-orange-500">
                <input type="number" id="custPhone" placeholder="Númeru WhatsApp" class="w-full p-3 bg-gray-50 border rounded-lg text-sm font-bold outline-none focus:border-orange-500">
            </div>
        </div>

        <div class="sticky-bottom flex items-center shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
            <div class="flex-1 px-5 py-3">
                <p class="text-[9px] text-gray-400 font-bold uppercase">Total Pagamentu</p>
                <p id="totalDisplay" class="text-xl font-black shopee-text">$0.00</p>
            </div>
            <button onclick="kirimWA()" class="shopee-orange text-white px-8 py-6 font-black uppercase text-sm active:bg-orange-700 transition-all">
                Checkout <i class="fa-solid fa-paper-plane ml-1"></i>
            </button>
        </div>
    </div>

    <div id="adminPanel" class="fixed inset-0 bg-white z-[1000] hidden overflow-y-auto">
        <header class="bg-gray-900 p-5 text-white flex justify-between items-center sticky top-0">
            <h2 class="font-black italic">ADMIN ORDERS</h2>
            <button onclick="closeAdmin()" class="bg-red-500 px-4 py-2 rounded text-xs font-bold uppercase tracking-widest">Taka</button>
        </header>
        <div id="orderList" class="p-4 space-y-4"></div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Hyper X Cloud III", price: 110, img: "https://i.ibb.co/s95BXxZN/heandset-hyper-x-cloud-III-edit-foto.jpg" },
            { id: 2, name: "Ugreen Charger 20W", price: 35, img: "https://i.ibb.co/twJv4gTN/ugreen-20w-usb-c-charger-with-mfi-certified-lightning-cable-pd-usb-c-power-supply-usb-c-charging-plu.webp" },
            { id: 3, name: "Sarung Jempol King", price: 5, img: "https://i.ibb.co/Xf22qV6Z/sarung-jempol-gaming-ap-king.jpg" },
            { id: 4, name: "Lightning Braided", price: 15, img: "https://i.ibb.co/k2wMSj5k/kabel-extension-lightening-braided-kabel.jpg" },
            { id: 5, name: "Headset AKZ 6 Pro", price: 15, img: "https://i.ibb.co/bVRvptC/akz-6-pro-hitam.jpg" },
            { id: 6, name: "Funcooler AL19", price: 15, img: "https://i.ibb.co/bT53nsg/funcooler-al19.jpg" },
            { id: 7, name: "Splitter Kaizer", price: 15, img: "https://i.ibb.co/Ndgc73wq/splitter-lightening-kaizer.jpg" },
            { id: 8, name: "Kipas Acome AF001", price: 15, img: "https://i.ibb.co/C5YLyLF8/kipas-AF001-dark-blue.webp" },
            { id: 9, name: "HDMI 3in1 PX", price: 15, img: "https://i.ibb.co/N693FZGW/kabel-hdmi-ke-type-c-px.jpg" },
            { id: 10, name: "Video Capture PX", price: 15, img: "https://i.ibb.co/27L9fBnC/VIDEO-CAPTURE-HDMI-MEREK-PX.jpg" },
            { id: 11, name: "HyperX Earbuds", price: 15, img: "https://i.ibb.co/mr31wJVZ/hyper-X-cloud-earbuds-gaming.jpg" }
        ];

        function renderProducts() {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="product-card p-3 flex flex-col justify-between">
                    <img src="${p.img}" class="w-full h-24 object-contain mb-2">
                    <h3 class="text-[10px] text-gray-500 font-bold uppercase leading-tight h-8 overflow-hidden">${p.name}</h3>
                    <p class="shopee-text font-black text-base">$${p.price.toFixed(2)}</p>
                    <div class="flex items-center justify-between mt-2 bg-gray-50 rounded-lg p-1 border">
                        <button onclick="changeQty('q${p.id}', -1)" class="w-8 h-8 font-bold text-gray-300">-</button>
                        <input type="number" id="q${p.id}" value="0" min="0" class="bg-transparent w-8 text-center text-xs font-black outline-none" readonly>
                        <button onclick="changeQty('q${p.id}', 1)" class="w-8 h-8 font-bold shopee-text">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, n) {
            let el = document.getElementById(id);
            let val = parseInt(el.value) + n;
            if(val >= 0) { el.value = val; updateTotal(); }
        }

        function updateTotal() {
            let sum = 0;
            products.forEach(p => {
                let qty = parseInt(document.getElementById('q' + p.id).value) || 0;
                sum += (qty * p.price);
            });
            let ship = parseFloat(document.getElementById('ongkir').value);
            let total = sum > 0 ? sum + ship : 0;
            document.getElementById('totalDisplay').innerText = `$${total.toFixed(2)}`;
        }

        function kirimWA() {
            let name = document.getElementById('custName').value.trim();
            let phone = document.getElementById('custPhone').value.trim();
            let itemsText = "";
            let listInternal = [];
            let totalSasan = 0;

            products.forEach(p => {
                let qty = parseInt(document.getElementById('q' + p.id).value) || 0;
                if(qty > 0) {
                    itemsText += `✅ *${p.name}* (${qty}x)%0A`;
                    listInternal.push(`${p.name} (${qty}x)`);
                    totalSasan += (p.price * qty);
                }
            });

            if(!name || !phone || totalSasan === 0) {
                alert("⚠️ Favor hatama Naran, Nu. WA, no Hili Sasaan!");
                return;
            }

            // SIMPAN DATA INTERNU (BACKUP)
            let order = { id: Date.now(), name: name, phone: phone, items: listInternal.join(", "), total: document.getElementById('totalDisplay').innerText, time: new Date().toLocaleString() };
            let allOrders = JSON.parse(localStorage.getItem('ziustore_orders')) || [];
            allOrders.unshift(order);
            localStorage.setItem('ziustore_orders', JSON.stringify(allOrders));

            // FORMAT LINK WHATSAPP SEGERA
            let adminWA = "67073350229";
            let shipText = document.getElementById('ongkir').options[document.getElementById('ongkir').selectedIndex].text;
            let finalMsg = `*ZIUSTORE ORDER*%0A━━━━━━━━━━━━━━━━━━━━%0A👤 *NARAN:* ${name.toUpperCase()}%0A📱 *WA:* ${phone}%0A📍 *FATIN:* ${shipText}%0A━━━━━━━━━━━━━━━━━━━━%0A*SASAN SOSA:*%0A${itemsText}━━━━━━━━━━━━━━━━━━━━%0A💰 *TOTAL PAGU: ${document.getElementById('totalDisplay').innerText}*%0A━━━━━━━━━━━━━━━━━━━━`;
            
            // Uza link universal hodi iPhone la "Action Failed"
            window.location.href = "https://api.whatsapp.com/send?phone=" + adminWA + "&text=" + finalMsg;
        }

        function loginAdmin() {
            if(prompt("Admin Password:") === "admin123") {
                document.getElementById('adminPanel').style.display = 'block';
                let orders = JSON.parse(localStorage.getItem('ziustore_orders')) || [];
                document.getElementById('orderList').innerHTML = orders.map(o => `
                    <div class="bg-gray-50 border rounded-xl p-4 shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">${o.time}</p>
                            <p class="font-black shopee-text">${o.total}</p>
                        </div>
                        <h4 class="font-black text-gray-800 uppercase italic mb-2">${o.name}</h4>
                        <div class="text-[11px] text-gray-600 bg-white p-2 rounded border mb-3">${o.items}</div>
                        <div class="grid grid-cols-2 gap-2">
                            <a href="https://wa.me/${o.phone}" target="_blank" class="bg-green-500 text-white text-center py-2 rounded-lg text-xs font-black uppercase">Chat</a>
                            <a href="tel:${o.phone}" class="bg-blue-500 text-white text-center py-2 rounded-lg text-xs font-black uppercase">Call</a>
                        </div>
                    </div>
                `).join('') || "<p class='text-center py-10 opacity-30'>No Orders</p>";
            }
        }

        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
        renderProducts();
    </script>
</body>
</html>
