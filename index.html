<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIUSTORE | Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; -webkit-tap-highlight-color: transparent; }
        .product-card { background: white; border-radius: 12px; padding: 10px; border: 1px solid #eee; }
        .btn-checkout { background: #25d366; color: white; width: 100%; padding: 15px; border-radius: 12px; font-weight: 900; }
    </style>
</head>
<body class="p-4 flex justify-center">

    <div class="max-w-md w-full">
        <div class="flex items-center gap-3 mb-6 bg-white p-4 rounded-2xl shadow-sm">
            <img src="https://i.ibb.co/qYvPwykP/Whats-App-Image-2025-12-19-at-10-45-37-b356ef8c.jpg" class="w-12 h-12 rounded-full border-2 border-orange-500">
            <h1 class="text-xl font-black text-orange-600 italic">ZIUSTORE</h1>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6" id="productGrid"></div>

        <div class="bg-white p-5 rounded-2xl shadow-lg">
            <input type="text" id="custName" placeholder="Naran Kompletu..." class="w-full p-3 border rounded-xl mb-4 font-bold outline-none focus:border-green-500">
            
            <div class="flex justify-between items-center mb-6 px-2">
                <span class="text-xs font-bold text-gray-400">TOTAL:</span>
                <span id="totalDisplay" class="text-2xl font-black text-green-600">$0.00</span>
            </div>

            <button onclick="orderSekarang()" class="btn-checkout shadow-lg active:scale-95 transition-all">
                ORDER VIA WHATSAPP
            </button>
            <p class="text-[10px] text-center text-gray-400 mt-3 uppercase font-bold italic">Klik OK & Paste/Tempel di chat nanti</p>
        </div>
    </div>

    <script>
        const items = [
            { id: 1, n: "Hyper X Cloud III", h: 110, f: "https://i.ibb.co/s95BXxZN/heandset-hyper-x-cloud-III-edit-foto.jpg" },
            { id: 2, n: "Ugreen Charger 20W", h: 35, f: "https://i.ibb.co/twJv4gTN/ugreen-20w-usb-c-charger-with-mfi-certified-lightning-cable-pd-usb-c-power-supply-usb-c-charging-plu.webp" },
            { id: 3, n: "Sarung Jempol", h: 5, f: "https://i.ibb.co/Xf22qV6Z/sarung-jempol-gaming-ap-king.jpg" },
            { id: 4, n: "Lightning Braided", h: 15, f: "https://i.ibb.co/k2wMSj5k/kabel-extension-lightening-braided-kabel.jpg" },
            { id: 5, n: "Headset AKZ 6 Pro", h: 15, f: "https://i.ibb.co/bVRvptC/akz-6-pro-hitam.jpg" },
            { id: 6, n: "Funcooler AL19", h: 15, f: "https://i.ibb.co/bT53nsg/funcooler-al19.jpg" },
            { id: 7, n: "Splitter Kaizer", h: 15, f: "https://i.ibb.co/Ndgc73wq/splitter-lightening-kaizer.jpg" },
            { id: 8, n: "Kipas Acome AF001", h: 15, f: "https://i.ibb.co/C5YLyLF8/kipas-AF001-dark-blue.webp" },
            { id: 9, n: "HDMI 3in1 PX", h: 15, f: "https://i.ibb.co/N693FZGW/kabel-hdmi-ke-type-c-px.jpg" },
            { id: 10, n: "Video Capture PX", h: 15, f: "https://i.ibb.co/27L9fBnC/VIDEO-CAPTURE-HDMI-MEREK-PX.jpg" },
            { id: 11, n: "HyperX Earbuds", h: 15, f: "https://i.ibb.co/mr31wJVZ/hyper-X-cloud-earbuds-gaming.jpg" }
        ];

        function render() {
            let h = '';
            items.forEach(p => {
                h += `<div class="product-card flex flex-col items-center shadow-sm">
                    <img src="${p.f}" class="w-16 h-16 object-contain mb-2">
                    <p class="text-[9px] font-bold text-center h-8 overflow-hidden uppercase">${p.n}</p>
                    <p class="text-green-600 font-black text-sm">$${p.h}</p>
                    <input type="number" id="q${p.id}" value="0" min="0" onchange="calc()" class="w-full border rounded-md p-1 text-center font-bold text-xs">
                </div>`;
            });
            document.getElementById('productGrid').innerHTML = h;
        }

        function calc() {
            let t = 0;
            items.forEach(p => { t += (p.h * (document.getElementById('q'+p.id).value || 0)); });
            document.getElementById('totalDisplay').innerText = "$" + t.toFixed(2);
        }

        function orderSekarang() {
            let nama = document.getElementById('custName').value;
            let list = ""; let ada = false;
            items.forEach(p => {
                let q = document.getElementById('qty'+p.id) ? document.getElementById('qty'+p.id).value : document.getElementById('q'+p.id).value;
                if(q > 0) { list += `- ${p.n} (${q}x)\n`; ada = true; }
            });

            if(!nama || !ada) { alert("Favor hatama Naran no hili Sasan!"); return; }

            // DATA YANG AKAN DI COPY
            let teksCopy = `ORDER ZIUSTORE\nNaran: ${nama}\n\nSasan:\n${list}\nTotal: ${document.getElementById('totalDisplay').innerText}`;

            // PROSES COPY & JUMP
            navigator.clipboard.writeText(teksCopy).then(() => {
                alert("Pesanan sudah di COPY secara otomatis. Silakan PASTE/TEMPEL di chat WhatsApp Admin.");
                // BUKA LINK PROFILE WA BUSINESS BOS
                window.location.href = "https://wa.me/message/XVGBTU3TRCSZG1";
            }).catch(() => {
                // Jika browser jadul/error, langsung buka link saja
                window.location.href = "https://wa.me/message/XVGBTU3TRCSZG1";
            });
        }
        render();
    </script>
</body>
</html>
