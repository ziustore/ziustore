<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZIUSTORE | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; -webkit-tap-highlight-color: transparent; }
        .product-card { background: white; border-radius: 15px; padding: 12px; border: 1px solid #efefef; }
        .btn-order { background: #25d366; color: white; width: 100%; padding: 16px; border-radius: 12px; font-weight: 900; font-size: 16px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-order:active { transform: scale(0.95); }
        input[type=number] { border: 1px solid #ddd; border-radius: 8px; padding: 4px; text-align: center; width: 100%; font-weight: bold; }
    </style>
</head>
<body class="p-4 flex justify-center">

    <div class="max-w-md w-full">
        <div class="flex flex-col items-center mb-8">
            <img src="https://i.ibb.co/qYvPwykP/Whats-App-Image-2025-12-19-at-10-45-37-b356ef8c.jpg" class="w-20 h-20 rounded-full border-4 border-white shadow-lg mb-2">
            <h1 class="text-3xl font-black italic text-orange-600 tracking-tighter">ZIUSTORE</h1>
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Premium Gaming Gear</p>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-8" id="productGrid"></div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-gray-100">
            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Naran Kompletu</label>
            <input type="text" id="custName" placeholder="Ketik nama anda..." class="w-full p-3 bg-gray-50 border-2 border-gray-100 rounded-xl mb-4 outline-none focus:border-orange-500 font-bold transition-all">
            
            <div class="flex justify-between items-center bg-orange-50 p-4 rounded-2xl mb-6">
                <span class="text-xs font-bold text-gray-500 uppercase">Total Pagu</span>
                <span id="totalDisplay" class="text-2xl font-black text-orange-600">$0.00</span>
            </div>

            <button onclick="kirimKeWA()" class="btn-order transition-all flex items-center justify-center gap-2">
                BELI SEKARANG (WHATSAPP)
            </button>
            <p class="text-[9px] text-center text-gray-400 mt-4 font-bold italic uppercase tracking-tighter">
                Klik OK, lalu "Tempel/Paste" di chat WhatsApp Admin
            </p>
        </div>
        
        <div class="mt-10 mb-10 text-center opacity-20">
            <p class="text-[10px] font-bold uppercase">Ziustore © 2025</p>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, n: "Hyper X Cloud III", h: 110, f: "https://i.ibb.co/s95BXxZN/heandset-hyper-x-cloud-III-edit-foto.jpg" },
            { id: 2, n: "Ugreen Charger 20W", h: 35, f: "https://i.ibb.co/twJv4gTN/ugreen-20w-usb-c-charger-with-mfi-certified-lightning-cable-pd-usb-c-power-supply-usb-c-charging-plu.webp" },
            { id: 3, n: "Sarung Jempol", h: 5, f: "https://i.ibb.co/Xf22qV6Z/sarung-jempol-gaming-ap-king.jpg" },
            { id: 4, n: "Lightning Braided", h: 15, f: "https://i.ibb.co/k2wMSj5k/kabel-extension-lightening-braided-kabel.jpg" },
            { id: 5, n: "Headset AKZ 6 Pro", h: 15, f: "https://i.ibb.co/bVRvptC/akz-6-pro-hitam.jpg" },
            { id: 6, n: "Funcooler AL19", h: 15, f: "https://i.ibb.co/bT53nsg/funcooler-al19.jpg" },
            { id: 7, n: "Splitter Kaizer", h: 15, f: "https://i.ibb.co/Ndgc73wq/splitter-lightening-kaizer.jpg" },
            { id: 8, n: "Kipas Acome AF001", h: 15, f: "https://i.ibb.co/C5YLyLF8/kipas-AF001-dark-blue.webp" },
            { id: 9, n: "HDMI 3in1 PX", h: 15, f: "https://i.ibb.co/N693FZGW/kabel-hdmi-ke-type-c-px.jpg" },
            { id: 10, n: "Video Capture PX", h: 15, f: "https://i.ibb.co/27L9fBnC/VIDEO-CAPTURE-HDMI-MEREK-PX.jpg" },
            { id: 11, n: "HyperX Earbuds", h: 15, f: "https://i.ibb.co/mr31wJVZ/hyper-X-cloud-earbuds-gaming.jpg" }
        ];

        function render() {
            let html = '';
            products.forEach(p => {
                html += `
                <div class="product-card flex flex-col items-center shadow-sm">
                    <img src="${p.f}" class="w-20 h-20 object-contain mb-2">
                    <p class="text-[9px] font-black text-center h-8 overflow-hidden uppercase text-gray-600 mb-1 leading-tight">${p.n}</p>
                    <p class="text-orange-600 font-black text-sm mb-2">$${p.h.toFixed(2)}</p>
                    <input type="number" id="q${p.id}" value="0" min="0" onchange="hitung()" class="outline-none focus:border-orange-500">
                </div>`;
            });
            document.getElementById('productGrid').innerHTML = html;
        }

        function hitung() {
            let total = 0;
            products.forEach(p => {
                let q = document.getElementById('q'+p.id).value || 0;
                total += (p.h * q);
            });
            document.getElementById('totalDisplay').innerText = "$" + total.toFixed(2);
        }

        function kirimKeWA() {
            let nama = document.getElementById('custName').value.trim();
            let totalPagu = document.getElementById('totalDisplay').innerText;
            let listSasan = "";
            let adaSasan = false;

            products.forEach(p => {
                let q = document.getElementById('q'+p.id).value;
                if(q > 0) {
                    listSasan += `- ${p.n} (${q}x)\n`;
                    adaSasan = true;
                }
            });

            if(!nama || !adaSasan) {
                alert("Favor hatama Naran no hili Sasan!");
                return;
            }

            // LINK PROFILE WA BUSINESS YANG BOS BERIKAN
            const linkProfile = "https://wa.me/message/XVGBTU3TRCSZG1";

            // RINCIAN UNTUK DI COPY
            const rincianPesanan = `ZIUSTORE ORDER\n\nNaran: ${nama.toUpperCase()}\n\nSasan:\n${listSasan}\nTotal: ${totalPagu}`;

            // PROSES COPY & BUKA LINK
            navigator.clipboard.writeText(rincianPesanan).then(() => {
                alert("Pesanan sudah di COPY! Klik OK untuk masuk ke WhatsApp, lalu 'TEMPEL/PASTE' pesanan Anda.");
                window.location.href = linkProfile;
            }).catch(() => {
                // Jika browser blokir copy, tetap buka linknya
                window.location.href = linkProfile;
            });
        }

        render();
    </script>
</body>
</html>
