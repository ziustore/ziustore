<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIUSTORE SIMPEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; }
        .product-card { background: white; border-radius: 10px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-wa { background-color: #25d366; color: white; font-weight: bold; width: 100%; padding: 15px; border-radius: 10px; margin-top: 10px; display: block; text-align: center; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    </style>
</head>
<body class="p-4">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-orange-600">ZIUSTORE</h1>
        <p class="text-xs text-gray-500">Order Gaming Gear Cepat & Mudah</p>
    </div>

    <div class="grid grid-cols-2 gap-3" id="produk">
        </div>

    <div class="mt-8 bg-white p-4 rounded-xl shadow-md">
        <h3 class="font-bold border-b pb-2 mb-4">Data Pesanan</h3>
        
        <label class="text-xs font-bold text-gray-400">NAMA LENGKAP</label>
        <input type="text" id="naran" placeholder="Contoh: Alex">

        <label class="text-xs font-bold text-gray-400 mt-4 block">LOKASI KIRIM</label>
        <select id="fatin" onchange="hitung()">
            <option value="0">BAUCAU VILA (FREE)</option>
            <option value="2.5">VENILALE (+$2.50)</option>
            <option value="3.5">LAGA (+$3.50)</option>
            <option value="5">DILI (+$5.00)</option>
        </select>

        <div class="mt-6 p-4 bg-orange-50 rounded-lg text-center">
            <p class="text-xs text-gray-500 font-bold uppercase">Total Tagihan</p>
            <h2 id="totalDisplay" class="text-3xl font-black text-orange-600">$0.00</h2>
        </div>

        <button onclick="kirimWA()" class="btn-wa mt-4 shadow-lg active:scale-95">
            HUBUNGI ADMIN (WHATSAPP)
        </button>
    </div>

    <script>
        const daftarSasan = [
            { id: 1, nama: "Hyper X Cloud III", harga: 110, foto: "https://i.ibb.co/s95BXxZN/heandset-hyper-x-cloud-III-edit-foto.jpg" },
            { id: 2, nama: "Ugreen Charger 20W", harga: 35, foto: "https://i.ibb.co/twJv4gTN/ugreen-20w-usb-c-charger-with-mfi-certified-lightning-cable-pd-usb-c-power-supply-usb-c-charging-plu.webp" },
            { id: 3, nama: "Sarung Jempol", harga: 5, foto: "https://i.ibb.co/Xf22qV6Z/sarung-jempol-gaming-ap-king.jpg" },
            { id: 4, nama: "Lightning Braided", harga: 15, foto: "https://i.ibb.co/k2wMSj5k/kabel-extension-lightening-braided-kabel.jpg" },
            { id: 5, nama: "Headset AKZ 6 Pro", harga: 15, foto: "https://i.ibb.co/bVRvptC/akz-6-pro-hitam.jpg" },
            { id: 6, nama: "Funcooler AL19", harga: 15, foto: "https://i.ibb.co/bT53nsg/funcooler-al19.jpg" },
            { id: 7, nama: "Splitter Kaizer", harga: 15, foto: "https://i.ibb.co/Ndgc73wq/splitter-lightening-kaizer.jpg" },
            { id: 8, nama: "Kipas Acome AF001", harga: 15, foto: "https://i.ibb.co/C5YLyLF8/kipas-AF001-dark-blue.webp" },
            { id: 9, nama: "HDMI 3in1 PX", harga: 15, foto: "https://i.ibb.co/N693FZGW/kabel-hdmi-ke-type-c-px.jpg" },
            { id: 10, nama: "Video Capture PX", harga: 15, foto: "https://i.ibb.co/27L9fBnC/VIDEO-CAPTURE-HDMI-MEREK-PX.jpg" },
            { id: 11, nama: "HyperX Earbuds", harga: 15, foto: "https://i.ibb.co/mr31wJVZ/hyper-X-cloud-earbuds-gaming.jpg" }
        ];

        function tampilkanProduk() {
            let html = '';
            daftarSasan.forEach(s => {
                html += `
                <div class="product-card">
                    <img src="${s.foto}" class="w-full h-24 object-contain">
                    <p class="text-[10px] font-bold mt-2 h-8 overflow-hidden">${s.nama}</p>
                    <p class="text-orange-600 font-bold">$${s.harga}</p>
                    <input type="number" id="qty${s.id}" value="0" min="0" onchange="hitung()" class="text-center mt-2 !p-1">
                </div>`;
            });
            document.getElementById('produk').innerHTML = html;
        }

        function hitung() {
            let subtotal = 0;
            daftarSasan.forEach(s => {
                let q = document.getElementById('qty'+s.id).value || 0;
                subtotal += (s.harga * q);
            });
            let ongkir = parseFloat(document.getElementById('fatin').value);
            let total = subtotal > 0 ? subtotal + ongkir : 0;
            document.getElementById('totalDisplay').innerText = "$" + total.toFixed(2);
        }

        function kirimWA() {
            let nama = document.getElementById('naran').value;
            let lokasi = document.getElementById('fatin').options[document.getElementById('fatin').selectedIndex].text;
            let listSasan = "";
            let adaSasan = false;

            daftarSasan.forEach(s => {
                let q = document.getElementById('qty'+s.id).value;
                if(q > 0) {
                    listSasan += `- ${s.nama} (${q}x)\n`;
                    adaSasan = true;
                }
            });

            if(!nama || !adaSasan) {
                alert("Isi nama dan pilih barang dulu ya!");
                return;
            }

            let total = document.getElementById('totalDisplay').innerText;
            let pesan = `Halo Ziustore,\n\nNama: ${nama}\nLokasi: ${lokasi}\n\nPesanan:\n${listSasan}\nTotal: ${total}`;
            
            // Link paling simpel dan aman untuk semua HP
            let url = "https://api.whatsapp.com/send?phone=67073350229&text=" + encodeURIComponent(pesan);
            window.location.href = url;
        }

        tampilkanProduk();
    </script>
</body>
</html>
