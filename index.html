<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZIUSTORE | Simple Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; }
        .product-card { background: white; border-radius: 12px; padding: 10px; border: 1px solid #e5e7eb; transition: 0.2s; }
        .product-card:active { transform: scale(0.96); }
        .btn-wa { background: #25d366; color: white; width: 100%; padding: 18px; border-radius: 12px; font-weight: 900; font-size: 16px; margin-top: 15px; }
    </style>
</head>
<body class="p-4 flex justify-center">

    <div class="max-w-md w-full">
        <div class="flex items-center gap-4 mb-6 bg-white p-4 rounded-2xl shadow-sm">
            <img src="https://i.ibb.co/qYvPwykP/Whats-App-Image-2025-12-19-at-10-45-37-b356ef8c.jpg" class="w-12 h-12 rounded-full border-2 border-orange-500">
            <div>
                <h1 class="text-xl font-black text-orange-600 italic">ZIUSTORE</h1>
                <p class="text-[10px] font-bold text-gray-400 uppercase">Gaming Store Timor-Leste</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6" id="displayProduk"></div>

        <div class="bg-white p-5 rounded-2xl shadow-lg border-t-4 border-orange-500">
            <label class="text-[10px] font-black text-gray-400 uppercase mb-1 block">Nama Pelanggan</label>
            <input type="text" id="namaInput" placeholder="Masukkan nama..." class="w-full p-3 bg-gray-50 border rounded-xl mb-4 outline-none focus:border-orange-500 font-bold">
            
            <div class="flex justify-between items-center bg-orange-50 p-4 rounded-xl mb-2">
                <span class="text-xs font-bold text-gray-500">TOTAL</span>
                <span id="totalDisplay" class="text-2xl font-black text-orange-600">$0.00</span>
            </div>

            <button onclick="kirimSekarang()" class="btn-wa shadow-xl flex items-center justify-center gap-2">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.319 1.592 5.548 0 10.064-4.516 10.066-10.066.002-5.548-4.517-10.067-10.065-10.067-5.545 0-10.06 4.516-10.063 10.064-.001 1.936.5 3.738 1.565 5.43l-.953 3.477 3.571-.93z"></path></svg>
                BELI VIA WHATSAPP
            </button>
        </div>
    </div>

    <script>
        const sasan = [
            { id: 1, n: "Hyper X Cloud III", h: 110, f: "https://i.ibb.co/s95BXxZN/heandset-hyper-x-cloud-III-edit-foto.jpg" },
            { id: 2, n: "Ugreen Charger 20W", h: 35, f: "https://i.ibb.co/twJv4gTN/ugreen-20w-usb-c-charger-with-mfi-certified-lightning-cable-pd-usb-c-power-supply-usb-c-charging-plu.webp" },
            { id: 3, n: "Sarung Jempol", h: 5, f: "https://i.ibb.co/Xf22qV6Z/sarung-jempol-gaming-ap-king.jpg" },
            { id: 4, n: "Lightning Braided", h: 15, f: "https://i.ibb.co/k2wMSj5k/kabel-extension-lightening-braided-kabel.jpg" },
            { id: 5, n: "Headset AKZ 6 Pro", h: 15, f: "https://i.ibb.co/bVRvptC/akz-6-pro-hitam.jpg" },
            { id: 6, n: "Funcooler AL19", h: 15, f: "https://i.ibb.co/bT53nsg/funcooler-al19.jpg" },
            { id: 7, n: "Splitter Kaizer", h: 15, f: "https://i.ibb.co/Ndgc73wq/splitter-lightening-kaizer.jpg" },
            { id: 8, n: "Kipas Acome AF001", h: 15, f: "https://i.ibb.co/C5YLyLF8/kipas-AF001-dark-blue.webp" },
            { id: 9, n: "HDMI 3in1 PX", h: 15, f: "https://i.ibb.co/N693FZGW/kabel-hdmi-ke-type-c-px.jpg" },
            { id: 10, n: "Video Capture PX", h: 15, f: "https://i.ibb.co/27L9fBnC/VIDEO-CAPTURE-HDMI-MEREK-PX.jpg" },
            { id: 11, n: "HyperX Earbuds", h: 15, f: "https://i.ibb.co/mr31wJVZ/hyper-X-cloud-earbuds-gaming.jpg" }
        ];

        function render() {
            let res = '';
            sasan.forEach(p => {
                res += `
                <div class="product-card flex flex-col items-center">
                    <img src="${p.f}" class="w-16 h-16 object-contain mb-2">
                    <p class="text-[9px] font-black text-center h-8 overflow-hidden uppercase text-gray-500 mb-1">${p.n}</p>
                    <p class="text-orange-600 font-black text-sm mb-2">$${p.h}</p>
                    <input type="number" id="qty${p.id}" value="0" min="0" onchange="total()" class="w-full border p-1 text-center font-bold rounded-lg text-xs bg-gray-50 outline-none">
                </div>`;
            });
            document.getElementById('displayProduk').innerHTML = res;
        }

        function total() {
            let t = 0;
            sasan.forEach(p => {
                let qty = document.getElementById('qty'+p.id).value || 0;
                t += (p.h * qty);
            });
            document.getElementById('totalDisplay').innerText = "$" + t.toFixed(2);
        }

        function kirimSekarang() {
            let nama = document.getElementById('namaInput').value;
            let totalVal = document.getElementById('totalDisplay').innerText;
            
            if(!nama || totalVal === "$0.00") {
                alert("Harap masukkan nama dan pilih barang!");
                return;
            }

            // LINK SANGAT PENDEK (ANTI ERROR)
            // Hanya berisi Nama dan Total Harga
            let adminWA = "67073350229";
            let pesan = `Halo Ziustore, saya *${nama.toUpperCase()}*. Saya mau belanja dengan total: *${totalVal}*. Mohon admin bantu cek rinciannya.`;

            let url = "https://api.whatsapp.com/send?phone=" + adminWA + "&text=" + encodeURIComponent(pesan);
            
            // Langsung buka WhatsApp
            window.location.href = url;
        }

        render();
    </script>
</body>
</html>
